# Runs on the Raspberry Pi. The image tag is provided by the deploy workflow:
#   IMAGE=ghcr.io/<owner>/<repo>:sha-<commit> docker compose up -d
services:
  web:
    image: ${IMAGE:-ghcr.io/CHANGE_ME/astro-chat:latest}
    container_name: astro-chat
    restart: unless-stopped
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
