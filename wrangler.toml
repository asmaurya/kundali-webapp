# Cloudflare Worker + SPA assets. Workers Builds: npm ci && CI=true npm run build
# Optional secret: OPENAI_API_KEY (and OPENAI_MODEL) for live LLM answers.
name = "kundali-webapp"
main = "worker/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
