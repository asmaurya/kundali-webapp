name: Deploy to Raspberry Pi

# Runs on the Pi itself (self-hosted runner): self-hosted minutes are free,
# the build is native arm64, and no registry or SSH hop is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-astro-chat
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build static site
        run: npm run build

      - name: Build runtime image
        run: docker build --target runtime -t "astro-chat:${GITHUB_SHA::7}" .

      - name: Restart the container
        run: |
          set -eu
          mkdir -p "$HOME/astro-chat"
          cp docker-compose.yml "$HOME/astro-chat/docker-compose.yml"
          cd "$HOME/astro-chat"
          IMAGE="astro-chat:${GITHUB_SHA::7}" docker compose up -d --remove-orphans
          docker image prune -f
          docker ps --filter name=astro-chat --format '{{.Names}} {{.Status}} {{.Ports}}'
