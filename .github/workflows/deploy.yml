name: Deploy to Raspberry Pi (disabled)

# Disabled on purpose: production/beta is Cloudflare Workers (wrangler.toml).
# Raspberry Pi Docker was legacy and was failing on every main push.
# Keep this file so old workflow links still resolve; do not re-enable without
# a healthy self-hosted runner.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Disabled
        run: echo "Pi Docker deploy is disabled; use Cloudflare Workers."
